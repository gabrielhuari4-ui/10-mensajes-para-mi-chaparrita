<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 mensajes para mi chaparrita 💌</title>

<style>
:root{
    --pink:#63a9f5;
    --rose:#2867b2;
    --ink:#294568;
    --cream:#f5faff;
    --lilac:#e5f1ff
}

*{
    box-sizing:border-box
}

body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at top left,#f8fcff 0,#e4f2ff 48%,#dce9ff 100%)
}

.decor{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden
}

.decor span{
    position:absolute;
    color:#d58ab0;
    opacity:.45;
    animation:twinkle 3s infinite alternate
}

@keyframes twinkle{
    to{
        opacity:.9;
        transform:scale(1.2)
    }
}

main{
    width:min(900px,92vw);
    margin:auto;
    padding:38px 0 55px;
    position:relative
}

.hero,.note{
    background:rgba(255,255,255,.86);
    border:1px solid #fff;
    border-radius:26px;
    box-shadow:0 16px 45px #477db51c
}

.hero{
    text-align:center;
    padding:clamp(22px,5vw,42px);
    margin-bottom:22px
}

.kicker{
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:.76rem;
    font-weight:800;
    color:#5689c2
}

h1{
    font-family:Georgia,serif;
    color:#2867b2;
    font-size:clamp(2.3rem,8vw,4.4rem);
    line-height:1.05;
    margin:13px 0
}

.hero p{
    max-width:600px;
    margin:0 auto;
    line-height:1.7
}

.bigheart{
    font-size:3rem;
    margin-bottom:8px
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px
}

.envelope{
    border:1px solid #c9e2fb;
    background:linear-gradient(145deg,#fbfdff,#eaf5ff);
    border-radius:20px;
    padding:20px 16px;
    text-align:center;
    cursor:pointer;
    min-height:160px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:transform .18s,box-shadow .18s
}

.envelope:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px #5d8fbd20
}

.envelope .emoji{
    font-size:2rem
}

.envelope strong{
    display:block;
    margin:8px 0;
    color:#2867b2
}

.envelope small{
    color:#98778b
}

.envelope.open{
    background:linear-gradient(145deg,#fff,#eaf2ff);
    border-color:#b8d6f5
}

.envelope.open small{
    font-weight:700;
    color:#4778b0
}

.note{
    margin-top:18px;
    padding:clamp(20px,5vw,34px);
    display:none;
    line-height:1.85;
    animation:appear .35s ease
}

.note.show{
    display:block
}

.note h2{
    font-family:Georgia,serif;
    color:#2867b2;
    margin-top:0
}

.note .signature{
    text-align:right;
    color:#2867b2;
    font-family:Georgia,serif;
    font-size:1.15rem;
    margin-top:22px
}

.close{
    background:#2867b2;
    color:white;
    border:0;
    border-radius:999px;
    padding:11px 18px;
    font-weight:700;
    cursor:pointer
}

.footer{
    text-align:center;
    font-size:.85rem;
    color:#7188a5;
    margin-top:20px
}

.heart{
    position:fixed;
    bottom:-35px;
    z-index:9;
    pointer-events:none;
    color:#4b9ee8;
    animation:float 4.5s linear forwards
}

@keyframes float{
    to{
        transform:translateY(-110vh) rotate(25deg);
        opacity:0
    }
}
</style>
</head>

<body>

<div class="decor" aria-hidden="true">
    <span style="left:7%;top:12%">✦</span>
    <span style="left:89%;top:18%;animation-delay:1s">♡</span>
    <span style="left:15%;top:78%;animation-delay:1.6s">✧</span>
    <span style="left:83%;top:73%;animation-delay:.4s">✦</span>
    <span style="left:48%;top:5%;animation-delay:2s">♡</span>
    <span style="left:95%;top:48%;animation-delay:1.3s">✧</span>
</div>

<main>

<section class="hero">
    <div class="bigheart">💌</div>

    <div class="kicker">
        Un regalo hecho especialmente para ti
    </div>

    <h1>10 mensajes<br>para mi chaparrita</h1>

    <p>
        Hay palabras que quiero que tengas contigo.
        Abre cada sobre cuando llegue ese momento.
        No tienes que abrirlos todos hoy. ❤️
    </p>
</section>

<section class="grid" id="grid" aria-label="Sobres de mensajes"></section>

<section class="note" id="note" aria-live="polite">
    <h2 id="noteTitle"></h2>

    <div id="noteBody"></div>

    <div class="signature">
        Con mucho cariño,<br>
        Hector ❤️
    </div>

    <button class="close" id="closeBtn">
        Cerrar carta
    </button>
</section>

<div class="footer">
    Hecho con cariño, solo para ti ✨
</div>

</main>

<script>

const letters = [

[
"💗",
"Abre cuando me extrañes",
`Mi chaparrita, si estás leyendo esto es porque quizás hoy me extrañas un poquito más de lo normal. Quiero que sepas que yo también pienso mucho en ti y que, aunque nos separen tantos kilómetros, siempre encuentro motivos para sonreír cuando hablamos. A veces me gustaría poder dejar por un momento las pantallas a un lado, acercarme a ti y darte ese abrazo que tantas veces imagino.

Me encantaría poder pasar una tarde contigo, jugar algo juntos, salir a pasear o simplemente quedarnos conversando de cualquier cosa. Incluso esos momentos que parecen simples serían muy especiales para mí si los compartiera contigo. Espero que nunca dudes de lo importante que eres para mí.

Mientras llega el día en que podamos estar cerquita, te mando muchos besitos y el abrazo más grande que pueda llegar hasta donde estás. ❤️❤️`
],

[
"🌷",
"Abre cuando estés triste",
`Hola, mi chaparrita. Si estás leyendo esto, quisiera poder estar a tu lado en este momento, abrazarte y recordarte que no tienes que fingir que todo está bien cuando no lo está. Sé que hay días en los que las cosas pesan más de lo que podemos explicar, y que a veces ni siquiera sabemos cómo expresar lo que sentimos.

Quiero que recuerdes que no tienes que ser fuerte todo el tiempo que está bien sentirse triste y que no tienes que encontrar todas las respuestas hoy ojalá pudiera quitarte un poquito de esa tristeza y ayudarte a encontrar tranquilidad, aunque ahora no pueda estar ahí para abrazarte, quiero que sepas que me importas muchísimo y que deseo de corazón verte bien, le pido a Dios que cuide de ti, que te dé paz en esos momentos en los que tu corazón se sienta cansado y que te recuerde lo valiosa que eres.

Y si algún día sientes que no tienes ganas de hablar, también está bien no tienes que buscar las palabras perfectas conmigo, solo quiero que recuerdes que eres alguien muy especial para mí, incluso en tus días más difíciles.

Te mando muchos besos y un abrazo enorme mi chaparrita ❤️`
],

[
"🌧️",
"Abre cuando tengas un mal día",
`Mi chaparrita, sé que no todos los días salen las cosas como esperamos y que a veces podemos sentirnos desanimados cuando algo no resulta como queríamos. Pero quiero que recuerdes que un día difícil no define todo lo que eres ni todo lo bonito que todavía te espera.

No te exijas demasiado cuando las cosas no salgan bien. Date tiempo, descansa y recuerda que también está bien detenerte un ratito cuando lo necesitas. No tienes que tener todo resuelto hoy, ni sentirte bien a cada momento.

Quiero que sepas que confío mucho en ti, en tus capacidades y en todo lo que puedes lograr. Me gustaría que, incluso en esos días en los que tú misma dudas de ti, puedas recordar que eres una persona valiosa y que tienes muchas cosas bonitas por delante.

Le pido a Dios que te dé fuerzas cuando te sientas cansada, tranquilidad cuando algo te preocupe y motivos para sonreír incluso después de un día complicado.

Espero que mañana sea un día más bonito para ti, mi chaparrita, y que poco a poco las cosas vayan mejorando. ❤️`
],

[
"😂",
"Abre cuando quieras reírte",
`Mi chaparrita, si abriste esto porque necesitas reírte quiero que imagines que estoy ahí contigo, haciendo alguna tontería solo para verte sonreír, probablemente terminarías riéndote de mí y no de lo que estoy haciendo JAJAJA, pero bueno mientras te saque una sonrisa yo feliz.

Me gusta mucho imaginarte riendo, porque hasta desde lejos logras alegrarme el día y aunque ahora solo pueda imaginar tu carita, espero que algún día pueda verte reír frente a mí y decirte: que linda te vez al estar feliz y al final sí te hice reírvon mis tonterias que haria para verte sonreir jsjs, te amo ❤️`
],

[
"🌙",
"Abre cuando no puedas dormir",
`Holaaa mi chaparrita. Antes de que te duermas, quería recordarte lo mucho que me alegra tenerte en mi vida, a veces me gustaría poder estar ahí, darte las buenas noches en persona, escuchar cómo estuvo tu día y quedarme conversando contigo un ratito más.

Espero que esta noche puedas descansar muy bonito, que tu corazón esté tranquilo y que mañana despiertes con muchas ganas de sonreír. Le pido a Dios que te cuide siempre, incluso en esos momentos en los que no puedo estar a tu lado.

Buenas noches, mi chaparrita. Que tengas dulces sueños. Y si por casualidad sueñas conmigo, espero que sea algo bonito JAJAJA ❤️, y si sigues sin poder dormir me puedes llamar para acompañarte hasta que te quedes dormida, pues la verdad si me gustaria acompañarte hasta que te duermas ❤️❤️`
],

[
"❤️",
"Abre cuando quieras recordar cuánto te quiero",
`Mi chaparrita, ¿sabes? A veces me quedo pensando en ti sin darme cuenta, en nuestras conversaciones, en tu voz y en lo bonito que se siente tenerte en mi vida. Hay momentos en los que quisiera poder acercarme a ti, tomarte de la mano y decirte todo lo que siento, sin tener que buscar las palabras.

Me gustaría poder abrazarte cuando tengas un día difícil, darte un besito en la frente cuando estés cansada y quedarme a tu lado mientras me cuentas cualquier cosa, incluso esas pequeñas cosas que quizás para ti no sean importantes, pero que a mí me encanta escuchar.

No sé cómo explicarlo, mi chaparrita, pero hay algo muy bonito en saber que existes y que puedo compartir tantas cosas contigo. Me haces sentir una felicidad que a veces ni siquiera sé cómo expresar.

Ojalá algún día pueda mirarte a los ojos, abrazarte fuerte y decirte en persona lo mucho que significas para mí. Por ahora, quiero que estas palabras te recuerden que hay alguien aquí que te quiere y te ama muchísimo y que se siente muy afortunado de tenerte. ❤️`
],

[
"🎮",
"Abre cuando quieras jugar conmigo",
`¿Jugamos Minecraft juntos, mi chaparrita? Me hace mucha ilusión imaginar que tengamos nuestro propio mundo, construir una casita, explorar, decorar cada rincón a nuestro gusto y vivir un montón de aventuras juntos. Me gustaría que ese mundo fuera como un pequeño lugar nuestro, donde podamos pasar horas jugando, haciendo construcciones y hasta perdiéndonos por explorar JAJAJA.

Y tampoco tienen que ser siempre los mismos juegos. Podemos jugar UNO, que fue el primer juego que compartimos juntos jsjs, o descubrir otros que todavía no hemos probado. Me gusta recordar que empezamos con una partida de UNO y pensar en todos los juegos y momentos que todavía nos quedan por compartir.

La verdad, no importa mucho qué estemos jugando. Si es Minecraft, UNO o cualquier otro juego, lo que más me gusta es la idea de compartir ese tiempo contigo, escucharte, reírnos y crear recuerdos que sean nuestros. Me encantaría que algún día podamos jugar uno al lado del otro, sin preocuparnos por la distancia ni por la conexión JAJAJA. 💙`
],

[
"✨",
"Abre cuando estés preocupada",
`Mi chaparrita, si hay algo que te está preocupando, quisiera que supieras que no tienes que guardártelo todo para ti. A veces las cosas se sienten más difíciles cuando las pensamos solitos, y aunque no siempre tenga las palabras exactas para ayudarte, quiero que sepas que me importa mucho cómo te sientes.

Me gustaría poder estar a tu lado, escucharte con calma, abrazarte y recordarte que no tienes que tener todo resuelto ahora. Puedes tomarte tu tiempo, descansar un poquito y seguir adelante cuando te sientas preparada.

Le pido a Dios que te dé tranquilidad, que cuide tu corazón y que te acompañe en aquello que hoy te preocupa. Y ojalá, cuando leas esto, recuerdes que tienes a alguien que te quiere mucho y que desea verte feliz.

Te mando un abrazo muy fuerte, mi chaparrita ❤️`
],

[
"🌸",
"Abre cuando quieras imaginar nuestro futuro",
`Mi chaparrita, a veces me pongo a imaginar cómo sería compartir tantas cosas contigo si estuviéramos cerquita. Me imagino saliendo contigo a pasear, caminando de la mano mientras hablamos de cualquier cosa, buscando algún lugar donde podamos comer algo rico y disfrutando de esos momentos en los que no necesitamos hacer nada especial para pasarla bien.

También me imagino jugando Minecraft contigo, teniendo nuestro propio mundo, construyendo una casa y decorándola a nuestro gusto. Me gustaría que fuera un lugar donde podamos hacer lo que se nos ocurra, explorar juntos, tener nuestras aventuras y pasar horas jugando sin darnos cuenta de cuánto tiempo ha pasado. Y seguro que en algún momento terminaríamos haciendo alguna tontería y riéndonos de eso JAJAJA.

Pero también pienso en esos momentos más tranquilos, como estar sentados juntos conversando, escucharte contarme cómo estuvo tu día, hablar de nuestros gustos, de las cosas que nos gustan y de todo aquello que todavía queremos conocer. Me gustaría poder compartir contigo incluso las cosas más pequeñas, esas que quizás no parecen importantes, pero que hacen que un día sea bonito.

A veces me pregunto cómo será poder verte sonreír frente a mí, escuchar tu voz sin estar detrás de una pantalla y poder abrazarte cuando nos encontremos. Hay tantas cosas que me gustaría hacer contigo que a veces me quedo imaginándolas sin darme cuenta.

Y no se trata de que todo tenga que ser perfecto ni de hacer grandes planes. Me gustaría que pudiéramos disfrutar de lo que tengamos, aprender juntos, conocernos cada vez más y compartir esos momentos que poco a poco se convertirían en recuerdos nuestros.

Me hace mucha ilusión pensar en todas las experiencias que todavía nos faltan por vivir, en los lugares que podríamos conocer, las comidas que podríamos probar y todas las cosas que podríamos hacer juntos. ❤️`
],

[
"🎂",
"Abre el día de tu cumpleaños",
`Mi chaparrita, ¡feliz cumpleaños! ❤️ Hoy es un día muy especial porque es el día en que nació una personita que, con el tiempo, se ha vuelto alguien muy importante para mí.

Espero que hoy puedas sonreír muchísimo, que recibas todo el cariño que mereces y que disfrutes cada pequeño momento de tu día. Le pido a Dios que te cuide siempre, que bendiga cada uno de tus pasos y que te ayude a cumplir todas esas metas y sueños que tienes en tu corazón. Deseo que este nuevo año de tu vida esté lleno de alegrías, aprendizajes, nuevas experiencias y muchas razones para sentirte orgullosa de ti misma.

Me gustaría poder estar ahí contigo, acompañarte durante el día, verte sonreír cuando abras tus regalos, compartir una torta contigo y darte un abrazo de esos que duran un poquito más de lo normal. Me imagino lo bonito que sería celebrar tu cumpleaños juntos, tomar muchas fotos, reírnos y disfrutar de ese momento sin tener que preocuparnos por la distancia.

Aunque hoy no pueda estar a tu lado como me gustaría, quiero que sepas que me hace muy feliz poder celebrar tu cumpleaños contigo de alguna manera. Me alegra que formes parte de mi vida y poder compartir contigo tantas conversaciones, momentos y sentimientos.

Espero que hoy te sientas muy querida, mi chaparrita, porque mereces recibir muchísimo cariño. Que tengas un cumpleaños precioso y que Dios te regale muchos años más de vida, llenos de salud, paz y felicidad.

¡Feliz cumpleaños mi chaparrita! Te mando muchos besos y abrazos y tambien todo mi cariño. ❤️!`
]

];

const grid = document.getElementById('grid');
const note = document.getElementById('note');

letters.forEach((item, i) => {

    const btn = document.createElement('button');

    btn.className = 'envelope';
    btn.type = 'button';

    btn.innerHTML = `
        <span class="emoji">${item[0]}</span>
        <strong>${item[1]}</strong>
        <small>♡ Pulsa para abrir ♡</small>
    `;

    btn.addEventListener('click', () => {

        document.querySelectorAll('.envelope')
        .forEach(x => x.classList.remove('open'));

        btn.classList.add('open');

        document.getElementById('noteTitle').textContent = item[1];
        document.getElementById('noteBody').textContent = item[2];

        note.classList.add('show');

        note.scrollIntoView({
            behavior:'smooth',
            block:'center'
        });

        burst();
    });

    grid.appendChild(btn);

});

document.getElementById('closeBtn').addEventListener('click', () => {

    note.classList.remove('show');

    grid.scrollIntoView({
        behavior:'smooth',
        block:'start'
    });

});

function burst(){

    for(let i = 0; i < 12; i++){

        const h = document.createElement('span');

        h.className = 'heart';

        h.textContent = ['♥','♡','✦','💙']
        [Math.floor(Math.random() * 4)];

        h.style.left = Math.random() * 100 + 'vw';

        h.style.fontSize = (16 + Math.random() * 20) + 'px';

        h.style.animationDuration = (3 + Math.random() * 2) + 's';

        document.body.appendChild(h);

        setTimeout(() => h.remove(), 5500);

    }

}

</script>

</body>
</html>
